<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Management System</title>
    <meta name="description" content="A modern library management system" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --lib-primary: #1a3c5e;
        --lib-secondary: #c9a84c;
        --lib-accent: #f0e6d3;
        --lib-dark: #0f2439;
        --lib-light: #faf7f2;
      }
      body { font-family: 'Source Sans 3', sans-serif; background-color: var(--lib-light); color: #333; }
      h1,h2,h3,h4,h5,h6 { font-family: 'Merriweather', serif; }
      .navbar-lib { background: linear-gradient(135deg, var(--lib-primary), var(--lib-dark)) !important; }
      .btn-lib { background-color: var(--lib-primary); border-color: var(--lib-primary); color: #fff; }
      .btn-lib:hover { background-color: var(--lib-dark); border-color: var(--lib-dark); color: #fff; }
      .btn-lib-gold { background-color: var(--lib-secondary); border-color: var(--lib-secondary); color: var(--lib-dark); font-weight: 600; }
      .btn-lib-gold:hover { background-color: #b8952e; border-color: #b8952e; color: #fff; }
      .card-book { border: none; border-radius: 12px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; background: #fff; }
      .card-book:hover { transform: translateY(-6px); box-shadow: 0 12px 32px rgba(26,60,94,0.15); }
      .badge-lib { background-color: var(--lib-secondary); color: var(--lib-dark); }
      .bg-lib-accent { background-color: var(--lib-accent) !important; }
      .bg-lib-primary { background-color: var(--lib-primary) !important; }
      .text-lib-primary { color: var(--lib-primary) !important; }
      .text-lib-gold { color: var(--lib-secondary) !important; }
      .login-card { max-width: 420px; margin: 0 auto; border: none; border-radius: 16px; box-shadow: 0 8px 40px rgba(26,60,94,0.12); }
      .stat-card { border: none; border-radius: 12px; background: linear-gradient(135deg, var(--lib-primary), #2a5a8a); color: #fff; }
      .table-lib thead { background-color: var(--lib-primary); color: #fff; }
      .hero-section { background: linear-gradient(135deg, var(--lib-primary) 0%, var(--lib-dark) 100%); color: #fff; padding: 3rem 0; border-radius: 0 0 24px 24px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
